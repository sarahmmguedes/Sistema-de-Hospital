<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome Completo">
<input id="cpf" placeholder="CPF/RG">
<input id="nascimento" placeholder="Data de Nascimento">
<input id="sexo" placeholder="Nome da Mãe">
<input id="estado" placeholder="Estado Civil">
<input id="endereço" placeholder="Endereço">
<input id="telefone" placeholder="Telefone">
<input id="email" placeholder="E-mail">
<input id="contato" placeholder="Contato de Emergência">

<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    nome: nome.value,
    cpf: cpf.value,
    tipo: tipo.value,
    sexo: sexo.value,
    estado: estado.value,
    endereço: endereço.value,
    telefone: telefone.value,
    email: email.value,
    contato: contato.value
    
  })
 });
 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>
